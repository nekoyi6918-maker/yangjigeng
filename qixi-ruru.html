<title>七夕 · 给 ruru</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(180deg, #0a0a1a 0%, #111133 40%, #1a1a3a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', 'Noto Serif SC', 'Songti SC', serif;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }

  .bouquet-wrap {
    transform-origin: 200px 500px;
    animation: gentleSway 6s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.08; }
    50% { opacity: 0.7; }
  }

  @keyframes bloomIn {
    0% { opacity: 0; transform: scale(0.2) rotate(0deg); }
    50% { opacity: 0.7; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes stemGrow {
    0% { opacity: 0; }
    100% { opacity: 0.75; }
  }

  @keyframes leafIn {
    0% { opacity: 0; transform: scale(0.3); }
    100% { opacity: 0.7; transform: scale(1); }
  }

  @keyframes textFade {
    0% { opacity: 0; transform: translateY(16px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes gentleSway {
    0%, 100% { transform: rotate(-0.8deg); }
    50% { transform: rotate(0.8deg); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.6; }
  }

  @keyframes ribbonFlow {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }

  @keyframes fireflyMove {
    0% { opacity: 0; transform: translate(0, 0); }
    15% { opacity: 0.5; }
    50% { opacity: 0.25; transform: translate(-25px, -50px); }
    85% { opacity: 0.4; }
    100% { opacity: 0; transform: translate(15px, -90px); }
  }

  .star { animation: twinkle 3s ease-in-out infinite; }
  .stem { animation: stemGrow 1.5s ease-out forwards; opacity: 0; }
  .leaf { animation: leafIn 1s ease-out forwards; opacity: 0; }
  .flower { animation: bloomIn 2.2s ease-out forwards; opacity: 0; }
  .ribbon { animation: leafIn 1.5s ease-out forwards; opacity: 0; }
  .firefly { animation: fireflyMove 7s ease-in-out infinite; opacity: 0; }

  .text-block {
    text-align: center;
    animation: textFade 2.5s ease-out forwards;
    opacity: 0;
    position: relative;
    z-index: 2;
  }

  .text-qixi {
    color: #d4b896;
    font-size: 14px;
    letter-spacing: 6px;
    margin-bottom: 10px;
    font-weight: 300;
  }

  .text-name {
    color: rgba(240, 238, 246, 0.85);
    font-size: 22px;
    letter-spacing: 4px;
    line-height: 1.8;
  }

  .text-poem {
    color: rgba(240, 238, 246, 0.6);
    font-size: 13px;
    letter-spacing: 1.5px;
    line-height: 2.4;
    font-style: italic;
    margin-top: 20px;
    padding: 0 40px;
  }

  .text-sign {
    position: fixed;
    bottom: 36px;
    color: rgba(240, 238, 246, 0.5);
    font-size: 11px;
    letter-spacing: 3px;
    animation: pulse 3.5s ease-in-out infinite;
  }
</style>
