  .fade1 { opacity: 0; animation: fadeIn 2s ease-out 0.5s forwards; }
  .fade2 { opacity: 0; animation: fadeIn 2s ease-out 1.2s forwards; }
  .fade3 { opacity: 0; animation: fadeIn 2s ease-out 1.8s forwards; }
  .fade4 { opacity: 0; animation: fadeIn 2s ease-out 2.3s forwards; }
  .fade5 { opacity: 0; animation: fadeIn 2s ease-out 2.8s forwards; }
  .fade6 { opacity: 0; animation: fadeIn 2s ease-out 3.3s forwards; }

  .text1 { opacity: 0; animation: textUp 2s ease-out 4s forwards; }
  .text2 { opacity: 0; animation: textUp 2.5s ease-out 5s forwards; }
  .textsign { opacity: 0; animation: textUp 2s ease-out 6s forwards; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes textUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.1; }
    50% { opacity: 0.75; }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-0.5deg); }
    50% { transform: rotate(0.5deg); }
  }

  @keyframes glow {
    0%, 100% { opacity: 0; }
    30% { opacity: 0.45; }
    70% { opacity: 0.25; }
  }

  .star { animation: twinkle 3s ease-in-out infinite; }
  .bouquet { animation: sway 7s ease-in-out infinite; transform-origin: 200px 520px; }
  .glow-dot { animation: glow 6s ease-in-out infinite; }
